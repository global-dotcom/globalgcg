<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>에코바이오 정부지원사업 아카이브</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;800&display=swap');
        body { font-family: 'Pretendard', sans-serif; background-color: #f8fafc; }
        .modal-active { overflow: hidden; }
        .year-scroll::-webkit-scrollbar { height: 4px; }
        .year-scroll::-webkit-scrollbar-track { background: #f1f5f9; }
        .year-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        
        /* 로딩 스피너 애니메이션 */
        .spinner {
            border: 3px solid rgba(79, 70, 229, 0.1);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border-left-color: #4f46e5;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="text-slate-900">

    <div id="app" class="min-h-screen flex flex-col">
        <!-- 상단 네비게이션 -->
        <nav class="h-16 bg-white border-b px-6 flex items-center justify-between sticky top-0 z-40 shadow-sm">
            <div class="flex items-center gap-2">
                <div class="w-8 h-8 bg-indigo-600 rounded-lg flex items-center justify-center text-white">
                    <i data-lucide="layers" class="w-5 h-5"></i>
                </div>
                <h1 class="text-lg font-bold tracking-tight">EcoBio <span class="text-indigo-600">G-Biz</span></h1>
            </div>
            <button onclick="openModal()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-xl text-sm font-bold flex items-center gap-2 transition-all active:scale-95">
                <i data-lucide="plus" class="w-4 h-4"></i> 신규 등록
            </button>
        </nav>

        <main class="max-w-7xl mx-auto w-full p-6 grid grid-cols-1 lg:grid-cols-4 gap-8">
            <!-- 메인 대시보드 -->
            <div class="lg:col-span-3 space-y-6">
                <div id="yearSelector" class="flex gap-2 p-1 bg-slate-100 rounded-xl overflow-x-auto year-scroll pb-2 lg:pb-1">
                    <!-- JS 동적 생성 -->
                </div>

                <div id="projectGrid" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <!-- 초기 로딩 상태 -->
                    <div class="col-span-full py-24 flex flex-col items-center justify-center bg-white border-2 border-dashed rounded-[2.5rem]">
                        <div class="spinner mb-4"></div>
                        <p class="text-slate-400 font-medium">실시간 데이터를 동기화하고 있습니다...</p>
                    </div>
                </div>

                <!-- 하단 포털 링크 -->
                <div class="pt-8 border-t">
                    <h3 class="text-xs font-black text-slate-400 mb-4 flex items-center gap-2 uppercase tracking-widest">
                        <i data-lucide="link" class="w-3 h-3"></i> 주요 지원사업 포털
                    </h3>
                    <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-6 gap-3">
                        <a href="https://www.bizinfo.go.kr" target="_blank" class="p-3 bg-white border rounded-xl text-[11px] font-bold text-center hover:border-indigo-400 hover:text-indigo-600 transition-all">기업마당</a>
                        <a href="https://www.k-startup.go.kr" target="_blank" class="p-3 bg-white border rounded-xl text-[11px] font-bold text-center hover:border-indigo-400 hover:text-indigo-600 transition-all">K-Startup</a>
                        <a href="https://www.iris.go.kr" target="_blank" class="p-3 bg-white border rounded-xl text-[11px] font-bold text-center hover:border-indigo-400 hover:text-indigo-600 transition-all">IRIS</a>
                        <a href="https://www.ntis.go.kr" target="_blank" class="p-3 bg-white border rounded-xl text-[11px] font-bold text-center hover:border-indigo-400 hover:text-indigo-600 transition-all">NTIS</a>
                        <a href="https://www.smtech.go.kr" target="_blank" class="p-3 bg-white border rounded-xl text-[11px] font-bold text-center hover:border-indigo-400 hover:text-indigo-600 transition-all">SMTECH</a>
                        <a href="https://www.rnd.or.kr" target="_blank" class="p-3 bg-white border rounded-xl text-[11px] font-bold text-center hover:border-indigo-400 hover:text-indigo-600 transition-all">산업기술R&D</a>
                    </div>
                </div>
            </div>

            <!-- 사이드바 (추천 공고) -->
            <aside class="space-y-6">
                <div class="bg-slate-900 p-6 rounded-[2rem] shadow-xl text-white relative overflow-hidden">
                    <div class="absolute -right-4 -top-4 w-24 h-24 bg-indigo-500/20 rounded-full blur-2xl"></div>
                    <h3 class="font-bold flex items-center gap-2 mb-6 relative z-10 text-indigo-300">
                        <i data-lucide="sparkles" class="w-5 h-5"></i> AI 공고 자동 추천
                    </h3>
                    <div id="aiRecommendations" class="space-y-4 relative z-10">
                        <!-- 추천 리스트 -->
                    </div>
                </div>
                <div class="p-6 bg-white border rounded-[2rem] border-slate-100">
                    <h4 class="text-[10px] font-black text-slate-400 mb-4 uppercase tracking-wider">상태 동기화 가이드</h4>
                    <ul class="space-y-3 text-[11px] font-medium text-slate-500">
                        <li class="flex gap-2"><i data-lucide="zap" class="w-4 h-4 text-amber-500 shrink-0"></i> 클라우드 자동 저장 (실시간)</li>
                        <li class="flex gap-2"><i data-lucide="users" class="w-4 h-4 text-indigo-500 shrink-0"></i> 전 직원 데이터 공동 공유</li>
                    </ul>
                </div>
            </aside>
        </main>
    </div>

    <!-- 신규 등록 모달 -->
    <div id="modal" class="fixed inset-0 z-50 hidden flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm">
        <div class="bg-white w-full max-w-2xl rounded-[2.5rem] shadow-2xl flex flex-col max-h-[90vh] overflow-hidden">
            <div class="p-6 border-b flex justify-between items-center bg-slate-50">
                <h2 class="text-xl font-black text-slate-800">지원사업 신규 등록</h2>
                <button onclick="closeModal()" class="p-2 hover:bg-white rounded-full transition-colors"><i data-lucide="x" class="w-6 h-6"></i></button>
            </div>
            
            <form id="projectForm" class="p-6 overflow-y-auto space-y-4">
                <div class="grid grid-cols-2 gap-4">
                    <div class="col-span-2">
                        <label class="text-[11px] font-bold text-slate-400 ml-1 uppercase">사업명</label>
                        <input name="title" required class="w-full mt-1 px-4 py-3 bg-slate-50 border-2 border-transparent rounded-xl focus:border-indigo-500 outline-none font-bold" placeholder="공고 명칭 입력">
                    </div>
                    <div>
                        <label class="text-[11px] font-bold text-slate-400 ml-1 uppercase">주관처</label>
                        <input name="agency" required class="w-full mt-1 px-4 py-3 bg-slate-50 border-2 border-transparent rounded-xl focus:border-indigo-500 outline-none font-bold" placeholder="기관명">
                    </div>
                    <div>
                        <label class="text-[11px] font-bold text-slate-400 ml-1 uppercase">분야</label>
                        <select name="category" class="w-full mt-1 px-4 py-3 bg-slate-50 border-2 border-transparent rounded-xl focus:border-indigo-500 outline-none font-bold">
                            <option>연구과제</option><option>제조지원</option><option>마케팅</option><option>임상/인증</option><option>기타</option>
                        </select>
                    </div>
                    <div class="col-span-2">
                        <label class="text-[11px] font-bold text-slate-400 ml-1 uppercase">주요내용</label>
                        <textarea name="content" rows="2" class="w-full mt-1 px-4 py-3 bg-slate-50 border-2 border-transparent rounded-xl focus:border-indigo-500 outline-none font-bold" placeholder="지원 내용 요약"></textarea>
                    </div>
                    <div>
                        <label class="text-[11px] font-bold text-slate-400 ml-1 uppercase">사업비</label>
                        <input name="cost" class="w-full mt-1 px-4 py-3 bg-slate-50 border-2 border-transparent rounded-xl focus:border-indigo-500 outline-none font-bold" placeholder="예: 3억원">
                    </div>
                    <div>
                        <label class="text-[11px] font-bold text-slate-400 ml-1 uppercase">마감일정</label>
                        <input name="schedule" class="w-full mt-1 px-4 py-3 bg-slate-50 border-2 border-transparent rounded-xl focus:border-indigo-500 outline-none font-bold" placeholder="~00/00">
                    </div>
                    <div>
                        <label class="text-[11px] font-bold text-slate-400 ml-1 uppercase">진행상황</label>
                        <input name="progress" class="w-full mt-1 px-4 py-3 bg-slate-50 border-2 border-transparent rounded-xl focus:border-indigo-500 outline-none font-bold" placeholder="현황 요약">
                    </div>
                    <div>
                        <label class="text-[11px] font-bold text-slate-400 ml-1 uppercase">상태</label>
                        <select name="status" class="w-full mt-1 px-4 py-3 bg-slate-50 border-2 border-transparent rounded-xl focus:border-indigo-500 outline-none font-bold">
                            <option>대기</option><option>진행중</option><option>선정</option><option>탈락</option><option>완료</option>
                        </select>
                    </div>
                    <div class="col-span-2">
                        <label class="text-[11px] font-bold text-slate-400 ml-1 uppercase">공고 URL</label>
                        <input name="url" class="w-full mt-1 px-4 py-3 bg-slate-50 border-2 border-transparent rounded-xl focus:border-indigo-500 outline-none font-bold" placeholder="https://...">
                    </div>
                </div>
                
                <div class="flex gap-4 pt-6 bg-white sticky bottom-0">
                    <select name="year" id="formYear" class="px-4 py-3 border-2 rounded-xl font-bold text-indigo-600 outline-none"></select>
                    <button type="submit" id="saveBtn" class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded-xl shadow-lg transition-all active:scale-[0.98]">
                        정보 저장하기
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Firebase SDK v11 (모듈형 최신 버전) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, deleteDoc, doc, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // 초기 설정
        const firebaseConfig = JSON.parse(__firebase_config);
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'ecobio-biz-v1';

        let currentYear = '2026';
        let allProjects = [];
        const years = ['2024', '2025', '2026', '2027', '2028'];

        // UI 제어 함수들
        const initUI = () => {
            const selector = document.getElementById('yearSelector');
            selector.innerHTML = years.map(y => `
                <button onclick="window.changeYear('${y}')" class="year-btn shrink-0 px-6 py-2 rounded-lg text-sm font-bold transition-all ${y === currentYear ? 'bg-white shadow-sm text-indigo-600' : 'text-slate-400 hover:text-slate-600'}" data-year="${y}">${y}년</button>
            `).join('');
            document.getElementById('formYear').innerHTML = years.map(y => `<option value="${y}" ${y === currentYear ? 'selected' : ''}>${y}년</option>`).join('');
            
            // 더미 추천 공고
            const aiData = [
                { title: "2026 해양 바이오 클러스터 지원", agency: "해수부", dday: "D-10" },
                { title: "중기 기술혁신개발사업 (전략분야)", agency: "중기부", dday: "D-4" },
                { title: "화장품 소재 및 제형 기술개발", agency: "식약처", dday: "D-15" }
            ];
            document.getElementById('aiRecommendations').innerHTML = aiData.map(item => `
                <div class="p-4 bg-white/5 border border-white/5 rounded-2xl hover:bg-white/10 transition-colors">
                    <div class="flex justify-between items-start mb-1">
                        <span class="text-[10px] font-black text-indigo-400 uppercase tracking-tighter">${item.agency}</span>
                        <span class="text-[10px] font-bold text-rose-400">${item.dday}</span>
                    </div>
                    <div class="text-sm font-bold text-slate-100 leading-snug">${item.title}</div>
                </div>
            `).join('');
            
            if (window.lucide) lucide.createIcons();
        };

        const renderProjects = () => {
            const grid = document.getElementById('projectGrid');
            const filtered = allProjects
                .filter(p => p.year === currentYear)
                .sort((a, b) => (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0));

            if (filtered.length === 0) {
                grid.innerHTML = `<div class="col-span-full py-20 text-center text-slate-400 font-medium bg-white border-2 border-dashed rounded-[2.5rem]">등록된 ${currentYear}년 데이터가 없습니다.</div>`;
            } else {
                grid.innerHTML = filtered.map(p => `
                    <div class="bg-white border p-6 rounded-[2rem] hover:shadow-xl transition-all border-slate-100 relative group animate-in fade-in duration-300">
                        <div class="flex justify-between items-start mb-4">
                            <span class="text-[10px] font-black px-2 py-0.5 bg-indigo-50 text-indigo-600 rounded-lg uppercase tracking-tight">${p.category}</span>
                            <div class="flex gap-2 opacity-0 group-hover:opacity-100 transition-opacity">
                                <button onclick="window.deleteProject('${p.id}')" class="p-2 text-slate-300 hover:text-rose-500"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                            </div>
                        </div>
                        <h3 class="text-lg font-black text-slate-800 leading-tight mb-1">${p.title}</h3>
                        <p class="text-xs font-bold text-indigo-500 mb-5">${p.agency}</p>
                        <div class="space-y-2 mb-6 text-[11px] font-bold">
                            <div class="flex justify-between"><span class="text-slate-400">사업비</span><span class="text-slate-700">${p.cost || '-'}</span></div>
                            <div class="flex justify-between"><span class="text-slate-400">마감</span><span class="text-slate-700 font-black text-rose-500">${p.schedule || '-'}</span></div>
                            <div class="flex justify-between"><span class="text-slate-400">현황</span><span class="text-slate-700">${p.progress || '-'}</span></div>
                        </div>
                        <div class="flex items-center justify-between pt-4 border-t border-slate-50">
                            <span class="text-[10px] font-black px-3 py-1 rounded-full ${['선정', '완료'].includes(p.status) ? 'bg-emerald-50 text-emerald-600' : p.status === '탈락' ? 'bg-rose-50 text-rose-600' : 'bg-amber-50 text-amber-600'}">${p.status}</span>
                            ${p.url ? `<a href="${p.url}" target="_blank" class="p-2 bg-slate-50 rounded-full text-slate-400 hover:text-indigo-600"><i data-lucide="external-link" class="w-4 h-4"></i></a>` : ''}
                        </div>
                    </div>
                `).join('');
            }
            if (window.lucide) lucide.createIcons();
        };

        // 전역 접근 가능한 함수 정의
        window.changeYear = (y) => {
            currentYear = y;
            initUI();
            renderProjects();
        };

        window.openModal = () => {
            document.getElementById('modal').classList.remove('hidden');
            document.body.classList.add('modal-active');
        };

        window.closeModal = () => {
            document.getElementById('modal').classList.add('hidden');
            document.body.classList.remove('modal-active');
            document.getElementById('projectForm').reset();
        };

        window.deleteProject = async (id) => {
            if (!confirm('정말 삭제하시겠습니까?')) return;
            try {
                // Rule 1: Strict Path
                await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'projects', id));
            } catch (err) { console.error("삭제 실패:", err); }
        };

        // 앱 구동 로직 (Rule 3)
        const startApp = async () => {
            initUI();
            
            try {
                // Rule 3: Auth first
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }
            } catch (err) { console.error("인증 처리 중:", err); }

            onAuthStateChanged(auth, (user) => {
                if (user) {
                    // Rule 1 & 2: Public Collection Sync
                    const colRef = collection(db, 'artifacts', appId, 'public', 'data', 'projects');
                    onSnapshot(colRef, (snapshot) => {
                        allProjects = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                        renderProjects();
                    }, (err) => {
                        console.error("동기화 오류:", err);
                        document.getElementById('projectGrid').innerHTML = `<div class="col-span-full py-20 text-center text-rose-500 font-bold bg-white border-2 border-dashed rounded-[2.5rem]">연결 오류가 발생했습니다. 권한을 확인해주세요.</div>`;
                    });
                }
            });

            // 저장 폼 핸들러
            document.getElementById('projectForm').onsubmit = async (e) => {
                e.preventDefault();
                if (!auth.currentUser) return;

                const btn = document.getElementById('saveBtn');
                btn.disabled = true;
                btn.innerText = "저장 중...";

                const formData = new FormData(e.target);
                const data = Object.fromEntries(formData.entries());
                
                try {
                    await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'projects'), {
                        ...data,
                        createdAt: serverTimestamp()
                    });
                    closeModal();
                } catch (err) {
                    console.error("저장 실패:", err);
                } finally {
                    btn.disabled = false;
                    btn.innerText = "정보 저장하기";
                }
            };
        };

        window.onload = startApp;
    </script>
</body>
</html>
